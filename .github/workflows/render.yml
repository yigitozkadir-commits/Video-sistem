name: Render videos

# Manual trigger only - a render run consumes Actions minutes. Nothing here
# runs on push/PR.
#
# The matrix below ships with one example entry pointing at
# remotion_template (the studio's generic composition skeleton - see
# CLAUDE.md and remotion_template/README inside this package). Once you
# copy remotion_template/ to remotion_<project_id>/ for a real project,
# add one matrix entry per composition you need rendered, following the
# same {"project", "composition", "out"} shape.
on:
  workflow_dispatch:
    inputs:
      compositions:
        description: 'Comma-separated composition IDs to render, or "all" for every composition in the matrix below.'
        required: false
        default: "all"

jobs:
  determine-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ALL='[
            {"project":"remotion_template","composition":"studio-video","out":"master.mp4"}
          ]'
          if [ "${{ github.event.inputs.compositions }}" = "all" ] || [ -z "${{ github.event.inputs.compositions }}" ]; then
            echo "matrix=$(echo "$ALL" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            IDS="${{ github.event.inputs.compositions }}"
            echo "matrix=$(echo "$ALL" | jq -c --arg ids "$IDS" '[.[] | select(.composition as $c | ($ids | split(",") | index($c)) != null)]')" >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: determine-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Headless Chromium's runtime deps on a bare Ubuntu runner.
      # https://www.remotion.dev/docs/miscellaneous/linux-dependencies
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libexpat1 libdbus-1-3 libgbm1 libasound2t64 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libx11-6 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 || \
          sudo apt-get install -y \
            libnss3 libnspr4 libexpat1 libdbus-1-3 libgbm1 libasound2 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libx11-6 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      # If your project's Remotion public/{still,video,audio} is gitignored
      # (the studio's default pattern - see scripts/sync_remotion_public.py),
      # a fresh checkout on this runner has none of those files. Sync them
      # from projects/<id>/assets/ before rendering, or the render 404s on
      # every image. Add one case per project below once you copy
      # remotion_template/ to a real project directory.
      - name: Sync Remotion public/ assets
        run: |
          case "${{ matrix.project }}" in
            # remotion_<project_id>) python3 scripts/sync_remotion_public.py PRJ-<project_id> remotion_<project_id> ;;
            *) echo "No public/ sync configured for ${{ matrix.project }} - add a case above once this is a real project." ;;
          esac

      - name: Render ${{ matrix.composition }}
        working-directory: ${{ matrix.project }}
        run: npx remotion render src/index.ts ${{ matrix.composition }} ../output/${{ matrix.out }} --concurrency=2

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: output/${{ matrix.out }}
          retention-days: 30
